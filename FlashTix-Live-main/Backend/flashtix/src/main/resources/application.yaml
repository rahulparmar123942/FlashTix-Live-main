spring:
  datasource:
    # ── MySQL (Railway) ──────────────────────────────────────────
    url: ${DB_URL:jdbc:mysql://iriguchi.proxy.rlwy.net:25228/railway?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:IWqZWlnhHYbXJYNwkSfaZfEloNIMPDbm}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Kafka ────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    consumer:
      group-id: flashtix-ticketing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

  # ── Redis ────────────────────────────────────────────────────
  data:
    redis:
      url: ${REDIS_PUBLIC_URL:${REDIS_URL:}}
      host: ${REDIS_HOST:${RAILWAY_TCP_PROXY_DOMAIN:localhost}}
      port: ${REDIS_PORT:${RAILWAY_TCP_PROXY_PORT:6379}}
      password: ${REDIS_PASSWORD:${REDISPASSWORD:dZVIShTcXcZaocZaoqkflUPYiKWrfuXB}}

  # ── RabbitMQ ─────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

# ── Resilience4j ─────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

# ── MinIO / Object Storage ───────────────────────────────────
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:password123}
  bucket-name: ${MINIO_BUCKET:flashtix-assets}